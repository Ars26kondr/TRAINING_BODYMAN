<!DOCTYPE html>
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARSAE.Store - Поиск -  </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/Main_page.css' %}">
</head>

<body>
    {% include 'header.html' %}
    <h1><font color="black">Результаты по вашему запросу</font></h1>
    {% if games %}
    <div class="re2">
        {% for i in games %}
        {% include 'goods.html' with Game=i %}
        {% endfor %}
    </div>
    {% else %}
    <h2><font color="black">Ничего не найдено</font></h2>
    {% endif %}
</body>

</html>
